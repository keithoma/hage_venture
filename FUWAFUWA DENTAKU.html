<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FUWAFUWA DENTAKU</title>
  <style type="text/css">
    @media print {
      /* Hide everything on the page… */
      body * {
        display: none !important;
      }
      /* …except for the printable section */
      #printable-section,
      #printable-section * {
        display: block !important;
        visibility: visible !important;
      }
      /* Remove any extra spacing/margins */
      #printable-section {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      html, body {
        margin: 0;
        padding: 0;
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 60px;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000;
    }
    
    .bg_white {
      background-color: #ffffff;
      font-weight: bold;
    }
    
    .bg_on_focus {
      background-color: hsl(51, 100%, 50%);
      font-weight: bold;
    }
    
    a, button, h3, span, div, p, label {
      color: #000 !important;
    }
    
    #rest_button {
      width: 600px;
      height: 100px;
      font-size: 1.6em;
    }
    
    .align_wrap {
      text-align: center;
    }
    
    #subtotal_display {
      background-color: #6633cc;
      color: #ffffff;
    }
    
    .menu-item {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    input[type=checkbox] {
      transform: scale(2.5);
      margin-right: 20px;
    }
    
    #ordered_items_header {
      text-align: center;
    }
    
    .warning_area {
      font-size: 85%;
    }
    
    #first_warning {
      color: red;
    }
    
    .table-buttons {
      text-align: center;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100vw;
      padding: 0 5px;
      box-sizing: border-box;
    }
    
    .table-buttons button {
      font-size: 1.5em;
      padding: 10px;
      width: 100%;
      height: 80px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background-color: #ffffff;
      border: 2px solid #aaa;
      color: #000;
    }
    
    .table-buttons button.active {
      background-color: #6633cc;
      border-color: #4a2596;
      color: #ffffff;
    }
    
    .print-button {
      width: 600px;
      height: 100px;
      font-size: 1.6em;
      cursor: pointer;
      color: white;
      border: none;
      border-radius: 5px;
      display: block;
      margin: 20px auto; 
    }
  </style>
</head>
<body>
  <!-- Non-printable content -->
  <div id="menu">
    <p class="warning_area" id="first_warning">
      <!-- 案内文が必要なときはここに。 -->
    </p>
    <p class="warning_area">免責事項：自己責任でご使用ください。</p>
    <br>

    <div class="table-buttons">
      <button onclick="toggleTable(this, 'A')">A</button>
      <button onclick="toggleTable(this, 'B')">B</button>
      <button onclick="toggleTable(this, '1')">1</button>
      <button onclick="toggleTable(this, '2')">2</button>
      <button onclick="toggleTable(this, '3')">3</button>
      <button onclick="toggleTable(this, '4')">4</button>
      <button onclick="toggleTable(this, '5')">5</button>
      <button onclick="toggleTable(this, '6')">6</button>
      <button onclick="toggleTable(this, '7')">7</button>
      <button onclick="toggleTable(this, '8')">8</button>
      <button onclick="toggleTable(this, '9')">9</button>
      <button onclick="toggleTable(this, 'S1')">S1</button>
      <button onclick="toggleTable(this, 'S2')">S2</button>
      <button onclick="toggleTable(this, 'S3')">S3</button>
      <button onclick="toggleTable(this, 'も')">も</button>
    </div>

    <hr>
    <p>【Lunch】</p>
    <div id="lunch_area">
      <!-- Menu items generated by script -->
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Lunch Vegan Tofu Soup">
        <label for="Lunch Vegan Tofu Soup">Lunch Vegan Tofu Soup 6.9</label>
      </div>
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Lunch Chicken Soup">
        <label for="Lunch Chicken Soup">Lunch Chicken Soup 8.9</label>
      </div>
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Lunch Beef Soup">
        <label for="Lunch Beef Soup">Lunch Beef Soup 9.9</label>
      </div>
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Gyoza Soup">
        <label for="Gyoza Soup">Gyoza Soup 9.9</label>
      </div>
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Vegan Gyoza Soup">
        <label for="Vegan Gyoza Soup">Vegan Gyoza Soup 9.9</label>
      </div>
    </div>

    <hr>
    <p>【Side Dish】</p>
    <div id="side_dish_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Edamame">
        <label for="Edamame">Edamame 4.5</label>
      </div>
      <!-- More items... -->
    </div>

    <hr>
    <p>【Classics】</p>
    <div id="classics_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Okonomi Beef">
        <label for="Okonomi Beef">Okonomi Beef 13.9</label>
      </div>
      <!-- More items... -->
    </div>
    <hr>
    <div id="classics_options_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="+Okonomi Hiroshima Noodles">
        <label for="+Okonomi Hiroshima Noodles">+Okonomi Hiroshima Noodles 2</label>
      </div>
      <!-- More items... -->
    </div>

    <hr>
    <p>【Noodle】</p>
    <div id="noodle_soup_ramen_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Ramen Miso">
        <label for="Ramen Miso">Ramen Miso 12.9</label>
      </div>
      <!-- More items... -->
    </div>
    <div id="noodle_soup_udon_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Udon Kitsune">
        <label for="Udon Kitsune">Udon Kitsune 12.9</label>
      </div>
      <!-- More items... -->
    </div>
    <div id="noodle_soup_options_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="+Ramen Egg">
        <label for="+Ramen Egg">+Ramen Egg 1</label>
      </div>
      <!-- More items... -->
    </div>

    <hr>
    <p>【Dessert】</p>
    <div id="dessert_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Ice Cream">
        <label for="Ice Cream">Ice Cream 2</label>
      </div>
      <!-- More items... -->
    </div>
    <div id="dessert_options_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="+Strawberry">
        <label for="+Strawberry">+Strawberry 1</label>
      </div>
      <!-- More items... -->
    </div>

    <hr>
    <p>【Drink】</p>
    <div id="drink_cold_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Float Drink">
        <label for="Float Drink">Float Drink 6.9</label>
      </div>
      <!-- More items... -->
    </div>
    <div id="drink_hot_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="Hot Tea">
        <label for="Hot Tea">Hot Tea 4.3</label>
      </div>
      <!-- More items... -->
    </div>
    <div id="drink_options_area">
      <div class="menu-item">
        <input type="checkbox" onclick="onTap(this)" id="+Drink-Hafer">
        <label for="+Drink-Hafer">+Drink-Hafer 0.5</label>
      </div>
    </div>

    <hr>
    <p>
      <span id="current_item">Last added: </span><br>
      合計額: <span id="subtotal_display">0</span>
    </p>

    <hr>
    <div class="align_wrap">
      <button id="rest_button" onclick="reset()">CLEAR</button>
    </div>

    <hr style="height: 5px; background-color: #000; border: none;">
    <button class="print-button" onclick="printSection()">PRINT</button>
  </div>

  <!-- Printable section moved outside of #menu -->
  <div id="printable-section">
    <h3 id="instruction_header" style="text-align: center;">
      Kitchen Instruction Slip
    </h3>
    <div id="selected_table" style="border: 2px solid #aaa; padding: 5px; text-align: center; width: 33%; min-height: 40px; margin: 0 auto; font-size: 1.5em;">
    </div>
    <h3 id="ordered_items_header">
      オーダー数/ORDERED: <span id="num_items_display">0</span>
    </h3>
    <div style="color: red; font-weight:bold">
      <!-- Additional instructions if needed -->
    </div>
    <ul id="order_list_display_area" style="list-style-type: disc;"></ul>
  </div>

  <script type="text/javascript">
    function printSection() {
      window.print();
    }
    
    function checkNumber(obj) {
      const str = obj.value;
      if (str.match(/[^0-9]/g)) {
        alert("半角数値以外が入力されています");
      }
    }
    
    function bgChangeIn(obj) {
      obj.className = "bg_on_focus";
    }
    
    function bgChangeOut(obj) {
      obj.className = "bg_white";
    }
    
    function calcOnBlur(elem) {
      bgChangeOut(elem);
      calcChange();
    }
    
    // reset function
    function reset() {
      let checkboxes = document.querySelectorAll('input[type="checkbox"]');
      let inputs = document.querySelectorAll('input[type="number"]');
      const orderListDisplayArea = document.querySelector("#order_list_display_area");
    
      checkboxes.forEach(elem => elem.checked = false);
      inputs.forEach(elem => elem.value = "");
      orderListDisplayArea.innerHTML = "";
    
      foodItems.length = 0;
    
      currentItemDisplay.innerText = "";
      subtotalDisplay.innerText = "0";
      document.querySelector("#change_display") && (document.querySelector("#change_display").innerText = "");
    }
    
    function calcChange() {
      const sumAsked = document.querySelector("#sum_asked");
      const sumReceived = document.querySelector("#sum_received");
      let changeDisplay = document.querySelector("#change_display");
    
      if (!(sumAsked.value === "") && (Number(sumAsked.value) < Number(subtotalDisplay.innerText))) {
        changeDisplay.innerText = "エラー❗お客さんの申し出額が飲食合計額を下回っている！";
      } else if (!(sumReceived.value === "") && (Number(sumReceived.value) < Number(subtotalDisplay.innerText))) {
        changeDisplay.innerText = "エラー❗お客さんからの受取額が飲食合計額を下回っている！！";
      } else if (!(sumAsked.value === "") && !(sumReceived.value === "")) {
        const change = Number(sumReceived.value) - Number(sumAsked.value);
        changeDisplay.innerText = (change < 0) ? "エラー❗受取額は申し出額より多くなければならない！！" : change;
      }
    }
    
    // Menu items and prices
    const price = {};
    const menuItems = {
      "classics": {
        "Okonomi Beef": 13.9,
        "Okonomi Bonito": 13.9,
        "Okonomi Vegetarian": 12.9,
        "Okonomi Vegan": 11.9,
        "Curry Beef": 12.9,
        "Curry Chicken": 12.9,
        "Curry Vegetarian": 11.9,
        "Curry Vegan": 10.9,
        "Gyudon": 13.9
      },
      "classicsOptions": {
        "+Okonomi Hiroshima Noodles": 2,
        "+Okonomi Bonito": 0.5,
        "+Okonomi Dead Spicy": 0.5,
        "+Curry Dead Spicy": 0.5,
        "+Gyudon Dead Spicy": 0.5
      },
      "lunch": {
        "Lunch Vegan Tofu Soup": 6.9,
        "Lunch Chicken Soup": 8.9,
        "Lunch Beef Soup": 9.9,
        "Gyoza Soup": 9.9,
        "Vegan Gyoza Soup": 9.9
      },
      "noodleSoupRamen": {
        "Ramen Miso": 12.9,
        "Ramen Creamy": 13.5,
        "Ramen Spicy": 13.5,
        "Ramen Sesame": 13.5,
        "Ramen Angry Ramen": 13.9
      },
      "noodleSoupUdon": {
        "Udon Kitsune": 12.9,
        "Udon Kakiage": 13.9,
        "Udon Niku": 13.9,
        "Udon Curry": 13.9,
        "Udon Sesame": 13.9,
        "Udon EbiTempura": 14.9
      },
      "noodleSoupOptions": {
        "+Ramen Egg": 1,
        "+Ramen Dead Spicy": 0.5,
        "+Udon Poached Egg": 1,
        "+Udon Dead Spicy": 0.5
      },
      "sideDish": {
        "Edamame": 4.5,
        "Kimchi": 4.5,
        "Wakame": 4.5,
        "Nikuman": 5.5,
        "Kakiage": 5.5,
        "Gyoza": 5.9,
        "Vegan Gyoza": 5.9,
        "Karaage": 6.3,
        "Ebi Tempura": 6.9,
        "Takoyaki": 6.9,
        "Onigiri": 4.3
      },
      "dessert": {
        "Ice Cream": 2,
        "Mochi/Dango/Taiyaki": 4.2,
        "Dorayaki/Melonpan": 4.6,
        "Crêpe": 7.9,
        "Honey Toast": 9.9,
        "Parfait": 7.9,
        "Sweets Set": 10.9
      },
      "dessertOptions": {
        "+Strawberry": 1,
        "+Ice cream": 1.5
      },
      "drinkCold": {
        "Float Drink": 6.9,
        "Creamy Iced Latte": 6.5,
        "Bubble Tea": 5.2,
        "Cola/Zero/Water": 3.9,
        "Ramune/Erdinger": 4.2,
        "Eistee": 4.9,
        "Soda": 4.7
      },
      "drinkHot": {
        "Hot Tea": 4.3,
        "Hot Latte": 5.7,
        "Hot Caffè Latte": 4.5,
        "Americano": 4.0
      },
      "drinkOptions": {
        "+Drink-Hafer": 0.5
      }
    };
    
    Object.values(menuItems).forEach(item => Object.assign(price, item));
    
    function addFoodItem(area, priceList) {
      for (let [key, value] of Object.entries(priceList)) {
        const container = document.createElement("div");
        container.classList.add("menu-item");
    
        const food = document.createElement("input");
        food.setAttribute("type", "checkbox");
        food.setAttribute("onclick", "onTap(this)");
        food.setAttribute("id", key);
    
        const label = document.createElement("label");
        label.setAttribute("for", key);
        label.innerHTML = `${key} ${value}`;
    
        container.appendChild(food);
        container.appendChild(label);
        area.appendChild(container);
      }
    }
    
    addFoodItem(document.querySelector("#classics_area"), menuItems.classics);
    addFoodItem(document.querySelector("#classics_options_area"), menuItems.classicsOptions);
    addFoodItem(document.querySelector("#lunch_area"), menuItems.lunch);
    addFoodItem(document.querySelector("#noodle_soup_ramen_area"), menuItems.noodleSoupRamen);
    addFoodItem(document.querySelector("#noodle_soup_udon_area"), menuItems.noodleSoupUdon);
    addFoodItem(document.querySelector("#noodle_soup_options_area"), menuItems.noodleSoupOptions);
    addFoodItem(document.querySelector("#side_dish_area"), menuItems.sideDish);
    addFoodItem(document.querySelector("#dessert_area"), menuItems.dessert);
    addFoodItem(document.querySelector("#dessert_options_area"), menuItems.dessertOptions);
    addFoodItem(document.querySelector("#drink_cold_area"), menuItems.drinkCold);
    addFoodItem(document.querySelector("#drink_hot_area"), menuItems.drinkHot);
    addFoodItem(document.querySelector("#drink_options_area"), menuItems.drinkOptions);
    
    class FoodItem {
      constructor(name, price) {
        this.name = name;
        this.price = price;
      }
    }
    
    class FoodItemFactory {
      make(foodItemName) {
        return new FoodItem(foodItemName, price[foodItemName]);
      }
    }
    
    const foodItemFactory = new FoodItemFactory();
    
    let currentItemDisplay = document.querySelector("#current_item");
    let subtotalDisplay = document.querySelector("#subtotal_display");
    const numItemsDisplay = document.querySelector("#num_items_display");
    
    let foodItems = [];
    
    function onTap(elem) {
      const itemName = elem.id;
    
      if (elem.checked) {
        const foodItem = foodItemFactory.make(itemName);
        foodItems.push(foodItem);
        currentItemDisplay.innerText = "Last added: " + foodItem.name + ": " + foodItem.price;
        redrawSubtotalDisplay(foodItems);
        reRenderNumItmDisplay(foodItems);
        redrawOrderListDisplay(foodItems);
      } else {
        foodItems = foodItems.filter(item => item.name !== itemName);
        subtotalDisplay.innerText = calcSum(foodItems).toFixed(2);
        currentItemDisplay.innerText = "";
        reRenderNumItmDisplay(foodItems);
        redrawOrderListDisplay(foodItems);
      }
    }
    
    function duplicateItem(item) {
      const itemName = item.firstElementChild.firstElementChild.innerText;
      const foodItem = foodItemFactory.make(itemName);
      foodItems.push(foodItem);
      currentItemDisplay.innerText = "Last added: " + foodItem.name + ": " + foodItem.price;
      redrawSubtotalDisplay(foodItems);
      reRenderNumItmDisplay(foodItems);
      redrawOrderListDisplay(foodItems);
    }
    
    function calcSum(foodItems) {
      return foodItems.reduce((sum, item) => sum + item.price, 0);
    }
    
    function redrawSubtotalDisplay(foodItems) {
      subtotalDisplay.innerText = calcSum(foodItems).toFixed(2);
    }
    
    function reRenderNumItmDisplay(foodItems) {
      numItemsDisplay.innerText = foodItems.length;
    }
    
    function redrawOrderListDisplay(foodItems) {
      const orderListDisplayArea = document.querySelector("#order_list_display_area");
      orderListDisplayArea.innerHTML = "";
      foodItems.forEach(item => {
        const foodItemName = document.createElement("span");
        foodItemName.innerText = item.name;
    
        const foodItemPrice = document.createElement("span");
        foodItemPrice.innerText = ": " + item.price;
    
        const divInFoodItem = document.createElement("div");
        divInFoodItem.appendChild(foodItemName);
        divInFoodItem.appendChild(foodItemPrice);
    
        const foodItem = document.createElement("li");
        foodItem.setAttribute("onclick", "duplicateItem(this)");
        foodItem.appendChild(divInFoodItem);
    
        orderListDisplayArea.appendChild(foodItem);
      });
    }
    
    function toggleTable(button, table) {
      let buttons = document.querySelectorAll(".table-buttons button");
      buttons.forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      document.getElementById("selected_table").innerText = table;
    }
  </script>
</body>
</html>
